  "articleBody": "Can I drive my Ulcinj rental car into Albania? Do I need a Green Card for Kosovo? How long does the Sukobin/Muriqan crossing take? Is a Green Card required for Croatia, Bosnia or Serbia? What documents must my rental company provide for a border crossing? Is Croatia a realistic day trip from a car rented in Ulcinj? Cross-Border Car Rental Ulcinj is Montenegro's southern outpost — the closest town to Albania and the natural gateway to Albania and Kosovo. Most Ulcinj renters who cross a border head south into Albania, not north into Croatia. That changes what you need to prepare: Albania is the one neighbour where a paper Green Card is genuinely mandatory, and it must be arranged before you reach the crossing you will actually use. From Ulcinj, Shkodër is roughly 26–40 km away — about 30 to 50 minutes of driving. You cross at Sukobin (Montenegrin side) / Muriqan (Albanian side), which operates as a single joint checkpoint: both countries' border control sit in the same facility, so you are not clearing two separate booths. In practice this roughly halves the processing you would expect at a normal two-booth crossing. It runs 24/7, though summer weekends can still back up to about 2 hours at peak times. ⚠️ Albania is the one border in this region where a Green Card is legally required, not just a commercial upsell — and Sukobin/Muriqan does not sell them on site. Arrange the Green Card through your rental company before you leave Ulcinj, and confirm in writing that it covers Albania. The Božaj crossing near Podgorica sells them for ~€15/14 days, but that is not your route. Worth saying plainly, because rental companies don't always explain it: for Croatia, Bosnia and Herzegovina, and Serbia, you do not legally need a Green Card. These countries are part of the Multilateral Agreement license-plate subsystem — your Montenegrin plates themselves prove valid insurance at the border. If your rental company charges a \"Green Card fee\" for a Croatia or Serbia trip, that is a commercial surcharge for cross-border authorization, not a legal border requirement. Kosovo is the exception on the other side — outside the Green Card system entirely. Country Green Card Detail Albania Required Mandatory; arrange in advance (not sold at Sukobin) Kosovo Special case Outside Green Card system — border TPL €15/15 days; often banned Croatia Not required Multilateral Agreement — plate proves insurance Bosnia & Herzegovina Not required Same subsystem — no Green Card by law Serbia Not required Multilateral Agreement — 0.03% alcohol limit + vignette Kosovo is a real option from Ulcinj if you continue to Pristina or Prizren, but it carries a cost trap that catches renters by surprise. Because Kosovo is outside the Green Card system, you buy short-term third-party liability insurance from the Kosovo Insurance Bureau directly at the border. ⚠️ For a normal passenger car, border TPL is roughly €15 for 15 days. But if your rental is a large SUV or pickup classified with a payload over one tonne, the same insurance jumps to around €138 — the local TPL schedule treats it as commercial-adjacent. If you booked anything bigger than a standard sedan or compact SUV in Ulcinj and you are heading to Kosovo, ask your rental company for the vehicle's payload classification before you go. Two more checks: the Kula / Kulina crossing (the one from the south) is not 24/7 — it runs roughly 06:00 to 22:00, with possible winter closures, so plan your return before it shuts. And many Montenegro companies (Europcar, Stella Car) ban Kosovo outright — verify in writing before you plan a leg there. Whichever direction you are headed, carry these in the car — not in a photo on your phone: The original vehicle registration document — copies are routinely rejected at Montenegrin, Albanian and neighbouring borders. Confirm it is in the glovebox before you leave Ulcinj. Your rental agreement plus a written cross-border authorization naming the countries you may enter. A verbal \"that's fine\" is not enough if you are stopped. Your passport — the Croatian/Schengen side now runs the EU's Entry/Exit System (EES) biometric checks, which add a few minutes at that border. The paper Green Card, physically in hand, if Albania is on your route. Worth being upfront: Croatia is not the natural direction from Ulcinj. It is roughly 185 km away — a longer, more deliberate trip than the quick hop to Shkodër, since you drive most of the length of the Montenegrin coast first. If Dubrovnik is genuinely on your itinerary it is entirely doable — plates alone satisfy the insurance requirement — but factor in the drive time and the EES passport check, and expect your company to apply its standard cross-border fee regardless of the (non-mandatory) Green Card question. Bosnia sits under the same insurance rules and is a realistic add-on if you route north through the interior. Even where a Green Card is not legally required, companies charge a separate cross-border fee to authorize the car leaving the country, and these vary a lot. All figures below are indicative (Summer 2024) — verify directly with your rental company before you book, since terms shift by season. Company Cross-border fee Notes Europcar Montenegro €6.05/day (max €60.50) Kosovo, Greece, Bulgaria, Romania not allowed Sixt Montenegro €40 flat Kosovo not included MTL Rent €50 flat + 200 km/day €0.10/km over the daily limit CarWiz €50 flat All countries Stella Car €25 flat Kosovo banned Book your cross-border authorization and Green Card (if Albania is on the plan) when you reserve, not at pickup — Green Cards take time and aren't sold at Sukobin. Never let a GPS route sneak you across an unauthorized border. Companies like AbbyCar charge a flat €500 for exactly this, on top of voiding your insurance. Heading toward Serbia, note the strict 0.03% alcohol limit (effectively zero for newer drivers) and budget for the Serbian vignette. Driving the mountain route to Kosovo between 15 November and 1 April requires winter tyres with at least 4.0 mm tread — a legal requirement and genuinely relevant terrain. Can I drive my Ulcinj rental car into Albania? Yes, and it is the most common cross-border trip from Ulcinj — Shkodër is only 26–40 km away via the Sukobin/Muriqan joint checkpoint. You need a paper Green Card, arranged in advance, since it is not sold at that crossing. Do I need a Green Card for Kosovo? No — Kosovo sits outside the Green Card system. You buy short-term border insurance instead: about €15 for 15 days for a normal car, but roughly €138 if your rental is classified with a payload over one tonne. Confirm your vehicle's class first, and check your company doesn't ban Kosovo — Europcar and Stella Car do. How long does the Sukobin/Muriqan crossing take? It is a single joint checkpoint covering both Montenegrin and Albanian control in one stop, which roughly halves typical processing versus a two-booth border. Summer weekend queues can still stretch up to about 2 hours. Is a Green Card required for Croatia, Bosnia or Serbia? No. These fall under the Multilateral Agreement license-plate system, so your plates alone prove valid insurance. Any \"Green Card fee\" for those routes is a commercial surcharge, not a border-mandated cost. What documents must my rental company provide for a border crossing? The original vehicle registration (not a copy), a signed rental agreement with written cross-border authorization naming the countries, and — for Albania — a physical paper Green Card. Verify all are in the car before leaving Ulcinj. Is Croatia a realistic day trip from a car rented in Ulcinj? Not really — it is about 185 km away, much further than Albania, and best treated as a planned multi-day leg rather than a quick crossing."
